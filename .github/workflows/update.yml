name: Python Script and Publish to Vercel

on:
    workflow_dispatch:
    schedule:
      - cron: 13 12 * * *

permissions: {}

jobs:
  scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      # zizmor: ignore[artipacked] credentials are needed to push the updated database
      uses: actions/checkout@v7.0.1
      with:
          lfs: true

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Install dependencies
      run: uv pip install --system -r requirements.txt

    - name: Run Python script to generate SQLite database
      run: python program.py

    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "🗃️ Latest data: ${timestamp}" || exit 0
        git push
